services:
  - type: web
    name: freemobile-vip-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.webrtc
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: VIDEO_FPS
        value: "24"
